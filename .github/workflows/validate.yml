name: validate

on:
  pull_request:
  push:
    branches: [main]

env:
  TFPOLICY_VERSION: "0.3.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tfpolicy is not on any package manager yet, so pull the release
      # archive directly. It ships under an evaluation licence - see EULA.txt
      # in the archive.
      - name: Install tfpolicy
        run: |
          curl -sSLo tfpolicy.zip \
            "https://releases.hashicorp.com/tfpolicy/${TFPOLICY_VERSION}/tfpolicy_${TFPOLICY_VERSION}_linux_amd64.zip"
          unzip -q tfpolicy.zip tfpolicy
          chmod +x tfpolicy
          sudo mv tfpolicy /usr/local/bin/
          tfpolicy --version

      # Downloads the AWS provider schema and checks every policy against it,
      # so a typo'd attribute name fails here rather than in a real run.
      - name: Validate
        run: tfpolicy validate --policies=./policies

      - name: Test
        run: tfpolicy test --policies=./policies --tests=./tests
